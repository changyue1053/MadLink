name: iOS static XCFramework preview
'on':
  push:
    branches: [checkpoint/madlink-source-preview, checkpoint/madlink-ios-session-acceptance]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native archives, relocated consumer and synthetic XCTest
        run: |
          if [ "$GITHUB_REF" = refs/heads/checkpoint/madlink-ios-session-acceptance ]; then
            python3 ios/verify.py --session-acceptance
          else
            python3 ios/verify.py
          fi
