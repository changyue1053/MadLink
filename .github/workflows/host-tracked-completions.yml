name: MadLink tracked C completions host qualification
'on':
  push:
    branches: [checkpoint/madlink-tracked-completions]
permissions:
  contents: read
jobs:
  tracked-completions:
    if: github.event_name == 'push' && github.ref == 'refs/heads/checkpoint/madlink-tracked-completions'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Exact source and existing Linux GCC toolchain
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          for tool in gcc g++ ar python3; do
            command -v "$tool" >/dev/null || { echo 'FAIL: stock compiler prerequisites'; exit 1; }
          done
      - name: Existing v1 and relocated tracked SDK checks
        shell: bash
        env:
          CC: gcc
          CXX: g++
          EXTRA_CFLAGS: ''
          EXTRA_CXXFLAGS: ''
        run: |
          stage="$(mktemp -d "${RUNNER_TEMP}/madlink-tracked.XXXXXXXX")"
          trap 'rm -rf -- "$stage"' EXIT
          phase() {
            local label="$1"
            shift
            if "$@" > "$stage/test.log" 2>&1; then
              printf 'PASS: %s\n' "$label"
            else
              printf 'FAIL: %s\n' "$label"
              return 1
            fi
          }
          phase core-v1 sh run-tests.sh
          phase c-abi-v1 sh run-c-abi-tests.sh
          phase relocated-tracked-gcc python3 -I -B packaging/test-tracked-completions.py
          phase relocated-tracked-gcc-ubsan python3 -I -B packaging/test-tracked-completions.py --ubsan
          printf '%s\n' 'Linux x86_64 host only: v1 regressions and independent relocated tracked C consumers passed, including UBSan and allocator faults. No mobile, network, crash durability or peer delivery verification.' >> "$GITHUB_STEP_SUMMARY"
